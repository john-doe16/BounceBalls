bled),select:hover{border-color:var(--muted)}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--text);outline-offset:1px}button.primary{background:var(--text);border-color:var(--text);color:var(--surface);font-weight:500}button.ghost{background:transparent}button.link{height:auto;padding:0;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:2px}button.link:hover{color:var(--text)}button.wide{width:100%}kbd{font:500 11px/1 Archivo,system-ui,sans-serif;color:inherit;opacity:.55;margin-left:6px}.fighter{display:grid;grid-template-columns:10px 1fr 32px;align-items:center;gap:4px 10px;margin-bottom:10px}.fighter .swatch{width:10px;height:10px;border-radius:50%}.fighter select{width:100%}.fighter .remove{width:32px;padding:0;color:var(--muted);background:transparent;border-color:transparent;font-size:16px}.fighter .remove:hover:not(:disabled){color:var(--text);border-color:var(--line)}.fighter small{grid-column:2 / 3;color:var(--muted);font-size:12px}.field{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px;min-height:32px;margin-bottom:6px}.field>span{color:var(--text)}.seg{grid-column:2 / 4;display:flex;background:var(--track);border-radius:4px;padding:2px}.seg button{flex:1;height:28px;border:0;background:transparent;color:var(--muted)}.seg button.on{background:var(--control);color:var(--text);box-shadow:0 0 0 1px var(--line)}.slider output{min-width:36px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--text)}.toggle{grid-template-columns:1fr auto;cursor:pointer}.toggle input{-webkit-appearance:none;-moz-appearance:none;appearance:none;width:32px;height:18px;margin:0;border-radius:9px;background:var(--track);position:relative;cursor:pointer;transition:background .15s}.toggle input:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--control);box-shadow:0 1px 2px #00000040;transition:transform .15s}.toggle input:checked{background:var(--text)}.toggle input:checked:after{transform:translate(14px)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{margin:0;padding:12px 18px 16px;color:var(--muted);font-size:12px}@media (prefers-reduced-motion: reduce){.toggle input,.toggle input:after{transition:none}}[hidden]{display:none!important}.panel-head{display:grid;gap:12px}select.wide{width:100%}#upload{margin-top:8px}.note{margin:8px 0 0;color:var(--muted);font-size:12px}.note:empty{display:none}.note.error{color:#d6336c}#format+.note{margin-bottom:8px}</style>
  </head>
  <body>
    <main id="app">
      <canvas id="view"></canvas>

      <aside id="panel">
        <header class="panel-head">
          <h1>Bounce Balls</h1>
          <div class="seg" id="mode">
            <button data-v="battle">Battle</button>
            <button data-v="music">Music</button>
          </div>
        </header>

        <section data-mode="battle">
          <div class="section-head">
            <h2>Fighters</h2>
            <button id="random" class="link">Shuffle</button>
          </div>
          <div id="fighters"></div>
          <button id="add" class="ghost wide">Add fighter</button>
        </section>

        <section data-mode="music">
          <h2>Song</h2>
          <select id="song" class="wide"></select>
          <input type="file" id="midiFile" accept=".mid,.midi,audio/midi" hidden />
          <button id="upload" class="ghost wide">Load a MIDI file</button>
          <p id="songInfo" class="note"></p>
        </section>

        <section data-mode="music">
          <h2>Format</h2>
          <div class="seg seg-full" id="format">
            <button data-v="ring">Ring</button>
            <button data-v="escape">Escape</button>
            <button data-v="grow">Grow</button>
            <button data-v="sync">Beat Sync</button>
          </div>
          <p id="formatInfo" class="note"></p>
          <label class="field toggle" id="shrinkRow"><span>Shrink ring</span><input type="checkbox" id="shrink" /></label>
          <label class="field toggle"><span>Color change on bounce</span><input type="checkbox" id="colorCycle" /></label>
          <label class="field toggle"><span>Show note on bounce</span><input type="checkbox" id="showNotes" /></label>
          <label class="field toggle"><span>Number on ball</span><input type="checkbox" id="ballNumber" /></label>
        </section>

        <section>
          <h2>Arena</h2>
          <div class="field" data-mode="battle">
            <span>Shape</span>
            <div class="seg" id="arena">
              <button data-v="square">Square</button>
              <button data-v="circle">Circle</button>
            </div>
          </div>
          <div class="field">
            <span>Theme</span>
            <div class="seg" id="theme">
              <button data-v="light">Light</button>
              <button data-v="dark">Dark</button>
            </div>
          </div>
          <label class="field slider">
            <span>Gravity</span>
            <input type="range" id="gravity" min="0" max="2000" step="50" />
            <output id="gravityOut"></output>
          </label>
          <label class="field slider">
            <span>Ball size</span>
            <input type="range" id="ballScale" min="0.5" max="2" step="0.1" />
            <output id="ballScaleOut"></output>
          </label>
          <label class="field slider">
            <span>Speed</span>
            <input type="range" id="speed" min="0.25" max="3" step="0.25" />
            <output id="speedOut"></output>
          </label>
        </section>

        <section>
          <h2>Options</h2>
          <label class="field toggle"><span>Sound</span><input type="checkbox" id="sound" /></label>
          <label class="field toggle"><span>Trails</span><input type="checkbox" id="trails" /></label>
          <label class="field toggle"><span>Ball outline</span><input type="checkbox" id="outline" /></label>
          <label class="field toggle" data-mode="battle"><span>Auto rematch</span><input type="checkbox" id="autoRematch" /></label>
          <label class="field toggle" data-mode="music"><span>Auto restart</span><input type="checkbox" id="autoRestart" /></label>
        </section>

        <section class="actions">
          <button id="fight" class="primary">Restart <kbd>R</kbd></button>
          <button id="pause" class="ghost">Pause <kbd>Space</kbd></button>
        </section>
        <p class="hint" data-mode="battle">Drag a ball to grab and fling it.</p>
        <p class="hint" data-mode="music">Every bounce plays the next note of the song. Click the arena once to turn on sound.</p>
      </aside>
    </main>
  </body>
</html>
